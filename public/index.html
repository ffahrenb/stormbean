/* VOICE  expert field guide for baristas and roasters: dense, exact, calm
   IDEA   a stencilled jute export sack and a cupping-lab notebook from origin
   PICTURE the live 3D stage: globe that unrolls into a map, origin diorama, cherry cross-section
   COLOUR parchment ground, espresso ink, cherry red leads; green-bean jade and robusta amber support
   TYPE   Saira Stencil One (sack stencil) for titles + Archivo for text
   LAYOUT espresso header band; stage fills left, notebook panel right 420px; phone: header, stage 50svh, panel */
:root{color-scheme:light;--bg:#efe7d8;--panel:#fbf8f1;--ink:#1d1410;--mute:#6a5b4f;--line:#e0d5c3;--head:#22160f;--headink:#f3ead9;--accent:#b3202a;--accentink:#ffffff;--jade:#2d7a5e;--amber:#c47a12;--chip:#f1eadc;--stage:radial-gradient(120% 90% at 40% 35%,#f7f1e6 0%,#e7dcc8 70%,#dccfb8 100%)}

:root[data-theme=dark]{color-scheme:dark;--bg:#120d0a;--panel:#1a1411;--ink:#f1e8da;--mute:#b3a493;--line:#352a22;--head:#0c0806;--headink:#f1e8da;--accent:#ff5a4f;--accentink:#1a0d0a;--jade:#6cc3a0;--amber:#f0a83a;--chip:#271e19;--stage:radial-gradient(120% 90% at 40% 35%,#22201f 0%,#131416 70%,#0c0d10 100%)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
.top{display:flex;align-items:center;gap:16px;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));padding-top:max(10px,env(safe-area-inset-top));background:var(--head);color:var(--headink)}

.tools{display:flex;gap:6px}

.tools svg{width:20px;height:20px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 440px;min-height:0}

#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none}
.lab{position:absolute;left:0;top:0;pointer-events:auto;border:0;padding:3px 8px;border-radius:6px;background:var(--panel);color:var(--ink);font-size:13px;font-weight:600;line-height:1.25;white-space:nowrap;box-shadow:0 1px 0 var(--line),0 2px 8px rgba(0,0,0,.12);visibility:hidden;display:flex;gap:6px;align-items:baseline}

.anat{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

.seg,.zoom{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.08)}

.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--ink);color:var(--panel)}
.zoom button{font-size:20px;line-height:1;padding:0}
.zoom svg{width:18px;height:18px;vertical-align:middle}
.leg3d{position:absolute;right:12px;bottom:12px;display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}

.leg3d i.b{width:18px;height:0;border-top:2px dashed var(--accent);border-radius:0}
.inset{position:absolute;left:12px;bottom:12px;width:180px;border-radius:12px;border:1px solid var(--line);overflow:hidden;display:grid;grid-template-rows:auto 170px auto;pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.inset .it,.inset .ic{background:var(--panel);font-size:13px;padding:5px 10px;line-height:1.3}
.inset .it{grid-row:1}#insetView{grid-row:2}.inset .ic{grid-row:3}
.inset .it{color:var(--mute)}
.inset .ic{font-weight:600}
.tip[hidden]{display:none !important}
.tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--ink);color:var(--panel);padding:6px 10px;border-radius:8px;font-size:13px;display:grid;gap:1px;z-index:3}
.glmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:80%;text-align:center;color:var(--mute);font-size:15px}
body:not([data-view=journey]) .inset,body[data-view=chem] .ctl,body[data-view=journey] .leg3d,body[data-view=chem] .leg3d,body[data-view=var] .leg3d{display:none}
body:not([data-view=map]) #modeSeg,body:not([data-view=map]) #styleSeg{display:none}
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain;padding:22px 24px max(28px,env(safe-area-inset-bottom))}
.panel h2{font:400 34px/1.05 "Saira Stencil One",Impact,"Arial Narrow",sans-serif;margin:0 0 8px;text-wrap:balance;letter-spacing:.005em}
.panel h3{font-size:17px;font-weight:700;margin:22px 0 8px}
.panel h4{font-size:15px;font-weight:700;margin:14px 0 6px}
.panel p{margin:0 0 10px}
.lead{color:var(--mute)}
.small,.src{font-size:13px;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 6px}
.kpis div{border-top:3px solid var(--accent);padding-top:6px}
.kpis b{display:block;font:400 28px/1 "Saira Stencil One",Impact,sans-serif;font-variant-numeric:tabular-nums}
.kpis span{font-size:13px;color:var(--mute);line-height:1.3;display:block;margin-top:3px}
.tblhead,.crow{display:grid;grid-template-columns:22px minmax(0,1.05fr) minmax(0,1fr) 42px 52px 40px;gap:8px;align-items:center}
.tlegend{display:flex;gap:14px;font-size:13px;color:var(--mute);margin-top:16px}.tlegend span{display:flex;gap:6px;align-items:center}.tlegend i{display:inline-block;width:10px;height:10px;border-radius:2px}
.tblhead{font-size:13px;color:var(--mute);margin-top:6px;padding:0 6px 4px;border-bottom:1px solid var(--line)}
.tblhead .lg{display:flex;gap:5px;align-items:center;white-space:nowrap;overflow:hidden}
.tblhead i,.splitlab i{display:inline-block;width:10px;height:10px;border-radius:2px}
i.a{background:var(--accent)}i.r{background:var(--amber)}
.rows{display:grid}
.crow{border:0;background:transparent;text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);border-radius:0;font-size:15px;min-height:44px}
button.crow:hover{background:var(--chip)}
.crow.on{background:var(--chip);box-shadow:inset 3px 0 0 var(--accent)}
.crow .rk{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.crow .cn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .bar{display:flex;height:12px;background:transparent}
.crow .bar i{display:block;height:100%}
.crow .bar i.a{border-radius:2px 0 0 2px}.crow .bar i.r{border-radius:0 2px 2px 0}
.num,.pc,.cu{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.crow .cu,.tblhead .cu{color:var(--mute);font-size:13px}
.crow .pc{font-size:14px}
.crow.rest{color:var(--mute)}
.refs .crow{grid-template-columns:0 minmax(0,0.9fr) minmax(0,1.6fr) 42px}
.refnote{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:var(--chip);border-radius:8px;padding:0 12px;height:40px;font-weight:600;margin-bottom:12px}
.kpiline{font-size:15px}.kpiline b{font:400 26px/1 "Saira Stencil One",Impact,sans-serif}
.up{color:var(--jade);font-weight:700}.down{color:var(--accent);font-weight:700}
.split{display:flex;height:14px;border-radius:3px;overflow:hidden;margin:10px 0 4px}
.split i{display:block}

.cal{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.cal .m{display:grid;gap:3px;text-align:center;font-size:12px;color:var(--mute)}

.facts{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:6px 12px;margin:16px 0 0;font-size:15px}

.facts dd{margin:0}
.pchips,.procs{display:flex;flex-wrap:wrap;gap:6px}
.pchip,.proc{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:0 12px;min-height:38px;font-size:14px;font-weight:600}
.pchip i,.proc i{width:10px;height:10px;border-radius:50%;background:var(--pc)}
.pchip em{font-style:normal;font-weight:500;color:var(--mute);font-size:13px}
.proc.on{background:var(--pc);border-color:var(--pc);color:#fff}
.proc.on i{background:#fff}
.proc.dim{opacity:.55}
.primary{display:inline-flex;align-items:center;justify-content:center;border:0;background:var(--accent);color:#fff;border-radius:10px;padding:0 18px;min-height:46px;font-weight:700;margin-top:18px}
:root[data-theme=dark] .primary{color:#1a0d0a}
.primary:disabled{opacity:.35}
.jctl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;margin-bottom:12px}
.jctl label{font-size:13px;color:var(--mute);font-weight:600}
select{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--chip);padding:0 10px;font-size:16px;width:100%}
.sum{font-size:15px;color:var(--mute);margin:12px 0 10px}
.warn{font-size:13px;background:color-mix(in srgb,var(--amber) 18%,transparent);border-radius:8px;padding:6px 10px}
.stepper{position:relative;display:flex;gap:2px;overflow-x:auto;padding:8px 0 6px;margin:6px -6px 0;scrollbar-width:thin;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%)}
.sdot{flex:0 0 auto;border:0;background:transparent;display:grid;justify-items:center;gap:5px;width:70px;padding:4px 2px;border-radius:8px;position:relative}
.sdot i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mute);background:var(--panel);z-index:1}
.sdot::before{content:"";position:absolute;top:10px;left:-1px;right:-1px;height:2px;background:var(--line)}
.sdot:first-child::before{left:50%}.sdot:last-child::before{right:50%}
